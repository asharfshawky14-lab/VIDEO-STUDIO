
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10151D">
    <meta name="description" content="VIDEO STUDIO - Professional Video Editor">
    <title>VIDEO STUDIO</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="app">

        <header class="app-header">
            <div class="brand">
                <span class="brand-icon">VS</span>
                <span class="brand-name">VIDEO STUDIO</span>
            </div>
            <button class="settings-button" aria-label="الإعدادات">⚙</button>
        </header>

        <main class="home-screen">

            <section class="welcome-section">
                <span class="welcome-label">PROFESSIONAL VIDEO EDITOR</span>

                <h1>
                    اصنع رؤيتك،
                    <span>واحكِ قصتك.</span>
                </h1>

                <p>
                    عالمك الإبداعي لصناعة وتحرير الفيديو
                    باحترافية وإمكانيات بلا حدود.
                </p>

                <button class="create-project-button">
                    <span>＋</span>
                    مشروع جديد
                </button>
            </section>

            <section class="projects-section">
                <div class="section-heading">
                    <h2>مشاريعك</h2>
                    <span>مشاريعك الأخيرة</span>
                </div>

                <div class="projects-container" id="projects-container">
                    <div class="empty-projects">
                        <div class="empty-icon">▶</div>
                        <h3>مساحتك الإبداعية بانتظارك</h3>
                        <p>ابدأ أول مشروع فيديو خاص بك.</p>
                    </div>
                </div>
            </section>

        </main>

        <footer class="app-footer">
            <span>VIDEO STUDIO</span>
            <span>CREATIVE WITHOUT LIMITS</span>
        </footer>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
